databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      comment: Создание таблицы customers
      preConditions:
        - not:
            tableExists:
              tableName: customers
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: age
                  type: INT
              - column:
                  name: phone_number
                  type: VARCHAR(15)
                  constraints:
                    unique: true

  - changeSet:
      id: 2
      author: your_name
      comment: Создание таблицы orders с внешним ключом
      preConditions:
        - and:
            - tableExists:
                tableName: customers
            - not:
                tableExists:
                  tableName: orders
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_customers
                    references: customers(id)
                    deleteCascade: true
              - column:
                  name: product_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: "amount > 0"

  - changeSet:
      id: 3
      author: your_name
      comment: Добавление тестовых данных
      preConditions:
        - and:
            - tableExists:
                tableName: customers
            - tableExists:
                tableName: orders
            - sqlCheck:
                sql: "SELECT COUNT(*) FROM customers"
                expectedResult: "0"
      changes:
        - insert:
            tableName: customers
            columns:
              - column:
                  name: name
                  value: "Alexey"
              - column:
                  name: surname
                  value: "Petrov"
              - column:
                  name: age
                  value: "30"
              - column:
                  name: phone_number
                  value: "+79161234567"
        - insert:
            tableName: customers
            columns:
              - column:
                  name: name
                  value: "Ivan"
              - column:
                  name: surname
                  value: "Ivanov"
              - column:
                  name: age
                  value: "25"
              - column:
                  name: phone_number
                  value: "+79167654321"
        - insert:
            tableName: orders
            columns:
              - column:
                  name: date
                  valueComputed: CURRENT_DATE
              - column:
                  name: customer_id
                  valueNumeric: 1
              - column:
                  name: product_name
                  value: "Laptop"
              - column:
                  name: amount
                  valueNumeric: 1
        - insert:
            tableName: orders
            columns:
              - column:
                  name: date
                  valueComputed: CURRENT_DATE
              - column:
                  name: customer_id
                  valueNumeric: 1
              - column:
                  name: product_name
                  value: "Mouse"
              - column:
                  name: amount
                  valueNumeric: 2
        - insert:
            tableName: orders
            columns:
              - column:
                  name: date
                  valueComputed: CURRENT_DATE
              - column:
                  name: customer_id
                  valueNumeric: 2
              - column:
                  name: product_name
                  value: "Keyboard"
              - column:
                  name: amount
                  valueNumeric: 1